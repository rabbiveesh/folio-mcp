[package]
name = "folio-mcp"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "MCP server that serves book pages to agents as images, from pluggable opaque backends"
repository = "https://github.com/rabbiveesh/folio-mcp"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
lru = "0.19.0"
rmcp = { version = "3.9.0", features = ["server", "transport-io", "transport-streamable-http-server", "macros"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "io-std", "process", "signal", "sync", "time", "net"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"

# Image decoding/resizing is painfully slow unoptimized.
[profile.dev.package."*"]
opt-level = 2
